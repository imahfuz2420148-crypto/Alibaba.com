<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prayer Battle">
<meta name="theme-color" content="#0d1024">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d1024'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230d1024'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Prayer Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #0d1024;
    --bg-panel: #161a35;
    --bg-panel-raised: #1e2344;
    --line: rgba(255,255,255,0.08);
    --gold: #e8b44c;
    --gold-dim: #7a6329;
    --teal: #3fd0c9;
    --coral: #ff6f6f;
    --text-main: #f2efe4;
    --text-dim: #9a9fc4;
    --glow-gold: 0 0 24px rgba(232,180,76,0.35);
    --glow-teal: 0 0 24px rgba(63,208,201,0.35);
    --glow-coral: 0 0 24px rgba(255,111,111,0.35);
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(232,180,76,0.08), transparent),
      radial-gradient(ellipse 600px 300px at 90% 100%, rgba(63,208,201,0.06), transparent),
      var(--bg-void);
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{max-width:480px;margin:0 auto;padding:16px 14px 90px;}

  /* ---------- Header ---------- */
  .brand{
    text-align:center;
    padding:18px 0 10px;
  }
  .brand-eyebrow{
    font-family:var(--font-display);
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold-dim);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:32px;
    letter-spacing:0.02em;
    margin:0;
    background:linear-gradient(180deg,#fff, var(--gold) 140%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* ---------- Identity switch ---------- */
  .identity-bar{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:16px;
    font-family:var(--font-display);
    font-size:13px;
    color:var(--text-dim);
    align-items:center;
    flex-wrap:wrap;
  }
  .identity-bar button{
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    color:var(--text-main);
    padding:5px 12px;
    border-radius:20px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .identity-bar button.active{
    border-color:var(--gold);
    color:var(--gold);
    box-shadow: 0 0 0 1px var(--gold) inset;
  }

  /* ---------- VS / Tug of war ---------- */
  .arena{
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 16px 16px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .arena::before{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(120deg, rgba(232,180,76,0.06), transparent 40%);
    pointer-events:none;
  }
  .vs-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .fighter{
    flex:1;
    text-align:center;
  }
  .fighter .avatar{
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    margin:0 auto 6px;
    background: var(--bg-panel-raised);
    border:2px solid var(--line);
  }
  .fighter.leading .avatar{
    border-color:var(--gold);
    box-shadow: var(--glow-gold);
  }
  .fighter-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
  }
  .fighter-score{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    color:var(--gold);
  }
  .fighter-streak{
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .vs-badge{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    color:var(--coral);
    letter-spacing:0.1em;
    padding:0 4px;
  }

  .rope-track{
    position:relative;
    height:14px;
    background: var(--bg-panel-raised);
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .rope-fill{
    position:absolute; top:0; bottom:0; left:0;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    border-radius:10px;
    transition: width 0.5s ease;
  }
  .rope-flag{
    position:absolute; top:-9px;
    width:2px; height:32px;
    background: var(--text-main);
    transition: left 0.5s ease;
  }
  .rope-flag::after{
    content:'🚩';
    position:absolute; top:-14px; left:-8px;
    font-size:16px;
  }
  .rope-labels{
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--text-dim);
    margin-top:6px;
    font-family:var(--font-display);
    letter-spacing:0.08em;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    background:var(--bg-panel);
    border-radius:14px;
    padding:4px;
    border:1px solid var(--line);
  }
  .tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:9px 4px;
    border-radius:10px;
    cursor:pointer;
    letter-spacing:0.03em;
  }
  .tabs button.active{
    background: var(--bg-panel-raised);
    color:var(--gold);
    box-shadow: 0 0 0 1px var(--line) inset;
  }

  /* ---------- Panels ---------- */
  .panel{
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:0.04em;
    color:var(--text-main);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .panel-title .date{
    font-size:11px;
    color:var(--text-dim);
    font-weight:500;
    font-family:var(--font-body);
  }

  .prayer-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .prayer-cell{
    aspect-ratio:1;
    border-radius:12px;
    background:var(--bg-panel-raised);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .prayer-cell .icon{font-size:18px;}
  .prayer-cell .label{
    font-size:9px;
    color:var(--text-dim);
    margin-top:3px;
    font-family:var(--font-display);
    letter-spacing:0.03em;
  }
  .prayer-cell.done{
    background: linear-gradient(160deg, rgba(63,208,201,0.18), rgba(63,208,201,0.05));
    border-color: var(--teal);
    box-shadow: var(--glow-teal);
  }
  .prayer-cell.done .label{color:var(--teal);}
  .prayer-cell:not(.locked):active{transform:scale(0.93);}
  .prayer-cell.locked{opacity:0.35; cursor:not-allowed;}

  .day-bonus{
    margin-top:10px;
    text-align:center;
    font-size:12px;
    color:var(--gold);
    font-family:var(--font-display);
    letter-spacing:0.04em;
    min-height:16px;
  }

  /* Leaderboard */
  .lb-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    color:var(--gold-dim);
    width:22px;
  }
  .lb-row.first .lb-rank{color:var(--gold);}
  .lb-info{flex:1;}
  .lb-name{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .lb-meta{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .lb-points{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    color:var(--text-main);
  }

  .round-actions{
    display:flex; gap:10px; margin-top:4px;
  }
  .btn{
    flex:1;
    font-family:var(--font-display);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--bg-panel-raised);
    color:var(--text-main);
    cursor:pointer;
  }
  .btn-primary{
    background: linear-gradient(160deg, var(--gold), #c68f2e);
    color:#1a1200;
    border:none;
    box-shadow: var(--glow-gold);
  }

  /* History */
  .hist-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-crown{font-size:18px;}
  .hist-text{flex:1; font-size:13px;}
  .hist-text b{color:var(--gold);}
  .hist-date{font-size:10px; color:var(--text-dim);}
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:24px 10px;
  }

  /* Winner overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,7,17,0.88);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:50;
  }
  .overlay-card{
    background: var(--bg-panel);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    max-width:360px;
    box-shadow: var(--glow-gold);
  }
  .overlay-crown{font-size:44px; margin-bottom:6px;}
  .overlay-title{
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:0.3em;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .overlay-winner{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:700;
    color:var(--gold);
    margin:6px 0 2px;
  }
  .overlay-sub{
    font-size:13px;
    color:var(--text-main);
    margin-bottom:18px;
  }
  .overlay-sub b{color:var(--coral);}

  .loading{
    text-align:center;
    padding:60px 10px;
    color:var(--text-dim);
    font-family:var(--font-display);
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading the battlefield…</div></div>

<script>
const PLAYERS = ['Turna','Abonti'];
const PRAYERS = [
  {key:'fajr', label:'Fajr', icon:'🌅'},
  {key:'dhuhr', label:'Dhuhr', icon:'☀️'},
  {key:'asr', label:'Asr', icon:'🌤️'},
  {key:'maghrib', label:'Maghrib', icon:'🌇'},
  {key:'isha', label:'Isha', icon:'🌙'},
];
const DATA_KEY = 'prayer-battle-state';
const ME_KEY = 'prayer-battle-my-identity';

let state = null;
let me = null;
let activeTab = 'today';
let pendingWinnerOverlay = null;

function todayStr(d=new Date()){
  return d.toISOString().slice(0,10);
}

function emptyDay(){
  return { Turna:[false,false,false,false,false], Abonti:[false,false,false,false,false] };
}

function defaultState(){
  return {
    roundStart: todayStr(),
    logs: {},
    history: []
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(DATA_KEY, true);
    state = res && res.value ? JSON.parse(res.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  try{
    const meRes = await window.storage.get(ME_KEY, false);
    me = meRes && meRes.value ? meRes.value : null;
  }catch(e){
    me = null;
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set(DATA_KEY, JSON.stringify(state), true);
  }catch(e){
    console.error('save failed', e);
  }
}

async function setMe(name){
  me = name;
  try{ await window.storage.set(ME_KEY, name, false); }catch(e){}
  render();
}

function getDay(dateStr){
  if(!state.logs[dateStr]) state.logs[dateStr] = emptyDay();
  return state.logs[dateStr];
}

function scoreForPlayer(player){
  let total = 0;
  const dates = Object.keys(state.logs).filter(d => d >= state.roundStart);
  for(const d of dates){
    const arr = state.logs[d][player] || [];
    const count = arr.filter(Boolean).length;
    total += count;
    if(count === 5) total += 2; // full-day bonus
  }
  return total;
}

function currentStreak(player){
  let streak = 0;
  let d = new Date();
  while(true){
    const ds = todayStr(d);
    const day = state.logs[ds];
    const allDone = day && day[player] && day[player].every(Boolean);
    if(allDone){
      streak++;
      d.setDate(d.getDate()-1);
    } else {
      // allow today to be incomplete without breaking streak if it's the current day
      if(ds === todayStr()) { d.setDate(d.getDate()-1); continue; }
      break;
    }
  }
  return streak;
}

function toggleFixedTodayIncomplete(){}

function render(){
  const app = document.getElementById('app');
  if(!me){
    app.innerHTML = renderIdentityPicker();
    attachIdentityHandlers();
    return;
  }

  const scoreT = scoreForPlayer('Turna');
  const scoreA = scoreForPlayer('Abonti');
  const maxScore = Math.max(scoreT, scoreA, 1);
  const total = scoreT + scoreA || 1;
  const pctT = Math.round((scoreT/total)*100);

  app.innerHTML = `
    ${renderBrand()}
    ${renderIdentityBar()}
    ${renderArena(scoreT, scoreA, pctT)}
    ${renderTabs()}
    ${activeTab === 'today' ? renderToday() : ''}
    ${activeTab === 'board' ? renderBoard(scoreT, scoreA) : ''}
    ${activeTab === 'history' ? renderHistory() : ''}
    ${pendingWinnerOverlay ? renderWinnerOverlay() : ''}
  `;
  attachHandlers();
}

function renderIdentityPicker(){
  return `
    ${renderBrand()}
    <div class="panel" style="text-align:center;">
      <div class="panel-title" style="justify-content:center;">Who's logging in?</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
        ${PLAYERS.map(p => `<button class="btn btn-primary" data-me="${p}">I'm ${p}</button>`).join('')}
      </div>
    </div>
  `;
}

function renderBrand(){
  return `
    <div class="brand">
      <div class="brand-eyebrow">⚔ Daily Duel</div>
      <h1>Prayer Battle</h1>
    </div>
  `;
}

function renderIdentityBar(){
  return `
    <div class="identity-bar">
      Logged in as
      ${PLAYERS.map(p => `<button class="${p===me?'active':''}" data-switch="${p}">${p}</button>`).join('')}
    </div>
  `;
}

function renderArena(scoreT, scoreA, pctT){
  const leaderIsT = scoreT > scoreA;
  const leaderIsA = scoreA > scoreT;
  const streakT = currentStreak('Turna');
  const streakA = currentStreak('Abonti');
  return `
    <div class="arena">
      <div class="vs-row">
        <div class="fighter ${leaderIsT?'leading':''}">
          <div class="avatar">🥋</div>
          <div class="fighter-name">Turna</div>
          <div class="fighter-score">${scoreT}</div>
          <div class="fighter-streak">🔥 ${streakT}d streak</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="fighter ${leaderIsA?'leading':''}">
          <div class="avatar">🥊</div>
          <div class="fighter-name">Abonti</div>
          <div class="fighter-score">${scoreA}</div>
          <div class="fighter-streak">🔥 ${streakA}d streak</div>
        </div>
      </div>
      <div class="rope-track">
        <div class="rope-fill" style="width:${pctT}%;"></div>
        <div class="rope-flag" style="left:calc(${pctT}% - 1px);"></div>
      </div>
      <div class="rope-labels"><span>TURNA</span><span>ABONTI</span></div>
    </div>
  `;
}

function renderTabs(){
  const tabs = [['today','Today'],['board','Leaderboard'],['history','History']];
  return `
    <div class="tabs">
      ${tabs.map(([k,l]) => `<button class="${activeTab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}
    </div>
  `;
}

function renderToday(){
  const ds = todayStr();
  const day = getDay(ds);
  const myArr = day[me];
  const count = myArr.filter(Boolean).length;
  const dateLabel = new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});

  return `
    <div class="panel">
      <div class="panel-title"><span>Your Prayers — ${me}</span><span class="date">${dateLabel}</span></div>
      <div class="prayer-grid">
        ${PRAYERS.map((p,i) => `
          <div class="prayer-cell ${myArr[i] ? 'done' : ''}" data-prayer-idx="${i}">
            <div class="icon">${p.icon}</div>
            <div class="label">${p.label}</div>
          </div>
        `).join('')}
      </div>
      <div class="day-bonus">${count === 5 ? '✨ Full house! +2 bonus points earned' : `${count}/5 logged today`}</div>
    </div>

    <div class="panel">
      <div class="panel-title">Opponent Watch</div>
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">
        ${otherPlayer()}'s progress today
      </div>
      <div class="prayer-grid">
        ${PRAYERS.map((p,i) => `
          <div class="prayer-cell locked ${day[otherPlayer()][i] ? 'done' : ''}">
            <div class="icon">${p.icon}</div>
            <div class="label">${p.label}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function otherPlayer(){
  return me === 'Turna' ? 'Abonti' : 'Turna';
}

function renderBoard(scoreT, scoreA){
  const rows = [
    {name:'Turna', score:scoreT, streak: currentStreak('Turna')},
    {name:'Abonti', score:scoreA, streak: currentStreak('Abonti')},
  ].sort((a,b)=>b.score-a.score);

  return `
    <div class="panel">
      <div class="panel-title">Round Standings <span class="date">since ${state.roundStart}</span></div>
      ${rows.map((r,i)=>`
        <div class="lb-row ${i===0?'first':''}">
          <div class="lb-rank">${i===0?'👑':'🥈'}</div>
          <div class="lb-info">
            <div class="lb-name">${r.name}</div>
            <div class="lb-meta">🔥 ${r.streak} day streak</div>
          </div>
          <div class="lb-points">${r.score}</div>
        </div>
      `).join('')}
    </div>
    <div class="panel">
      <div class="panel-title">End This Round</div>
      <div style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">
        Declares a winner for the current round, logs it to history, and starts a fresh battle from tomorrow. Loser buys the treat 😈
      </div>
      <div class="round-actions">
        <button class="btn btn-primary" id="declare-winner-btn">Declare Winner 🏆</button>
      </div>
    </div>
  `;
}

function renderHistory(){
  if(!state.history.length){
    return `<div class="panel"><div class="empty-state">No rounds finished yet.<br>Battle it out and declare your first winner!</div></div>`;
  }
  return `
    <div class="panel">
      <div class="panel-title">Past Rounds</div>
      ${state.history.slice().reverse().map(h => `
        <div class="hist-item">
          <div class="hist-crown">🏆</div>
          <div class="hist-text"><b>${h.winner}</b> beat ${h.loser} — ${h.scoreWinner} to ${h.scoreLoser}
            <div class="hist-date">Round ended ${h.endDate}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderWinnerOverlay(){
  const {winner, loser, scoreWinner, scoreLoser} = pendingWinnerOverlay;
  return `
    <div class="overlay">
      <div class="overlay-card">
        <div class="overlay-crown">🏆</div>
        <div class="overlay-title">Round Winner</div>
        <div class="overlay-winner">${winner}</div>
        <div class="overlay-sub">${scoreWinner} — ${scoreLoser}. <b>${loser}</b> owes a treat!</div>
        <div class="round-actions">
          <button class="btn btn-primary" id="confirm-winner-btn">Start New Round</button>
        </div>
      </div>
    </div>
  `;
}

function attachIdentityHandlers(){
  document.querySelectorAll('[data-me]').forEach(btn=>{
    btn.addEventListener('click', ()=> setMe(btn.getAttribute('data-me')));
  });
}

function attachHandlers(){
  document.querySelectorAll('[data-switch]').forEach(btn=>{
    btn.addEventListener('click', ()=> setMe(btn.getAttribute('data-switch')));
  });
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.getAttribute('data-tab'); render(); });
  });
  document.querySelectorAll('[data-prayer-idx]').forEach(cell=>{
    cell.addEventListener('click', async ()=>{
      const idx = parseInt(cell.getAttribute('data-prayer-idx'),10);
      const ds = todayStr();
      const day = getDay(ds);
      day[me][idx] = !day[me][idx];
      render();
      await saveState();
    });
  });
  const declareBtn = document.getElementById('declare-winner-btn');
  if(declareBtn){
    declareBtn.addEventListener('click', ()=>{
      const scoreT = scoreForPlayer('Turna');
      const scoreA = scoreForPlayer('Abonti');
      if(scoreT === scoreA){
        alert("It's a tie right now — log a few more prayers before declaring a winner!");
        return;
      }
      const winner = scoreT > scoreA ? 'Turna' : 'Abonti';
      const loser = winner === 'Turna' ? 'Abonti' : 'Turna';
      pendingWinnerOverlay = {
        winner, loser,
        scoreWinner: Math.max(scoreT,scoreA),
        scoreLoser: Math.min(scoreT,scoreA)
      };
      render();
    });
  }
  const confirmBtn = document.getElementById('confirm-winner-btn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', async ()=>{
      state.history.push({
        winner: pendingWinnerOverlay.winner,
        loser: pendingWinnerOverlay.loser,
        scoreWinner: pendingWinnerOverlay.scoreWinner,
        scoreLoser: pendingWinnerOverlay.scoreLoser,
        endDate: todayStr()
      });
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate()+1);
      state.roundStart = todayStr(tomorrow);
      pendingWinnerOverlay = null;
      activeTab = 'history';
      await saveState();
      render();
    });
  }
}

loadState();
</script>
</body>
</html>
